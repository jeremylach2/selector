name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      # The personal-data guard runs over every tracked file, not just a
      # diff: anything that ever slipped past the pre-commit hook fails here.
      - name: No personal data or secrets
        run: python3 scripts/check_personal_data.py
      # "Wrapped" is Spotify's product name. Public copy says "Rewind";
      # lowercase code identifiers (selector.warehouse.wrapped) don't match.
      - name: No Spotify branding in public copy
        run: |
          if grep -rnw "Wrapped" web/app web/components README.md; then
            echo 'Use "Rewind", not "Wrapped", in public copy (docs/PRIVACY.md).'
            exit 1
          fi
      - name: Install
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check .
      - name: Test
        run: uv run pytest -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Disclaimer on every page
        run: |
          for page in index rewind watch; do
            grep -q "Not affiliated with or endorsed by Spotify" ".next/server/app/$page.html" || { echo "$page is missing the not-affiliated disclaimer"; exit 1; }
          done
