[project]
name = "selector"
version = "0.1.0"
description = "A local music taste warehouse, MCP server, and fly-brain recommendation engine built from a Spotify Extended Streaming History export."
readme = "README.md"
license = "MIT"
authors = [
    { name = "Jeremy Lachowicz", email = "jdlacho2@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2",
    "pyarrow>=17.0",
    "duckdb>=1.1",
    "mcp>=2.2.0",
    "httpx>=0.27",
    "cryptography>=43",
    "python-dotenv>=1.0",
    "numpy>=2.5.3",
    "scipy>=1.18.1",
    "scikit-learn>=1.9.1",
    "matplotlib>=3.11.2",
    "librosa>=1.0",
    "soundfile>=0.14",
    "av>=13.0",
    "pydantic>=2.9",
    "anthropic>=0.40",
]

[project.optional-dependencies]
# Only needed for selector.tagger.train (LoRA fine-tuning). Kept optional
# so the rest of the project doesn't force a multi-GB torch download.
finetune = [
    "torch>=2.4",
    "transformers>=4.45",
    "peft>=0.13",
    "datasets>=3.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
    "respx>=0.21",
]

[project.scripts]
selector-mcp = "selector.mcp.server:main"

[build-system]
requires = ["uv_build>=0.10.2,<0.11.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
# Without this, a bare `pytest` also collects from tools/ (the gitignored
# llama.cpp checkout - see docs/GPU_INFERENCE.md), which ships its own
# differently-configured test suite.
testpaths = ["tests"]
